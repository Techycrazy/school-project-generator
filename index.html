<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Free School Project Generator | Class 6-12 AI Project Maker</title>
<meta name="description" content="Generate detailed school projects and PowerPoint outlines instantly for any subject using AI. Easy, free, and perfect for students from Class 6 to 12." />
<meta name="keywords" content="school project generator, class 9 project, science project ppt, free school project, project topic generator, AI school projects" />

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JHFZVDTLGF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-JHFZVDTLGF');
</script>

<!-- jsPDF for PDF download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f9fafb;
    margin: 0;
    padding: 0;
    color: #2c3e50;
  }
  .container {
    max-width: 600px;
    margin: 50px auto 40px;
    background: #fff;
    padding: 30px 35px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    font-weight: 700;
    margin-bottom: 15px;
    color: #1d3557;
  }
  .instructions {
    background: #d6e9fc;
    border-left: 5px solid #3498db;
    padding: 15px 20px;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 25px;
  }
  label {
    display: block;
    margin-top: 20px;
    font-weight: 600;
    font-size: 15px;
  }
  select, input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    transition: border-color 0.3s;
  }
  select:focus, input[type="text"]:focus, textarea:focus {
    border-color: #3498db;
    outline: none;
  }
  textarea {
    resize: vertical;
    min-height: 220px;
  }
  button {
    width: 100%;
    margin-top: 30px;
    background-color: #27ae60;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
    padding: 14px 0;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #1e874b;
  }
  button.secondary {
    background-color: #2980b9;
    margin-top: 15px;
  }
  button.secondary:hover {
    background-color: #1c5c8b;
  }
  @media (max-width: 650px) {
    .container {
      margin: 20px 15px 40px;
      padding: 25px 20px;
    }
    button {
      font-size: 16px;
      padding: 12px 0;
    }
  }
</style>
</head>
<body>
  <main class="container" role="main" aria-label="School Project Generator">
    <h1>📚 School Project Generator</h1>
    <div class="instructions" aria-live="polite">
      <strong>How to Use:</strong><br />
      1. Select your Class and Subject.<br />
      2. Enter your Project Topic.<br />
      3. Click <em>Generate Prompt</em>.<br />
      4. Click <em>Open Gemini AI</em> and paste the prompt.<br />
      5. Optionally, download the prompt as a PDF.
    </div>
    
    <label for="cls">Class</label>
    <select id="cls" aria-required="true">
      <option>6</option><option>7</option><option>8</option>
      <option>9</option><option>10</option><option>11</option><option>12</option>
    </select>
    
    <label for="sub">Subject</label>
    <select id="sub" aria-required="true">
      <option>Science</option>
      <option>Biology</option>
      <option>History</option>
      <option>Geography</option>
      <option>Civics</option>
      <option>English</option>
    </select>
    
    <label for="topic">Project Topic</label>
    <input id="topic" type="text" placeholder="Example: Photosynthesis" aria-required="true" />
    
    <button id="generateBtn" type="button">Generate Prompt</button>
    
    <label for="output">Gemini AI Prompt</label>
    <textarea id="output" readonly aria-live="polite" aria-label="Generated Gemini AI prompt"></textarea>
    
    <button id="downloadPdfBtn" type="button" class="secondary">Download Prompt as PDF</button>
    <button id="openGeminiBtn" type="button" class="secondary">Open Gemini AI</button>
  </main>
  
  <script>
    const generateBtn = document.getElementById('generateBtn');
    const openGeminiBtn = document.getElementById('openGeminiBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const output = document.getElementById('output');

    generateBtn.addEventListener('click', () => {
      const cls = document.getElementById('cls').value.trim();
      const sub = document.getElementById('sub').value.trim();
      const topic = document.getElementById('topic').value.trim();

      if (!topic) {
        alert('Please enter a project topic.');
        return;
      }

      const prompt = `
You are a school teacher.

Create a complete school project.

Class: ${cls}
Subject: ${sub}
Topic: ${topic}

Rules:
- Use simple language.
- Include headings and subheadings.
- Write an introduction, body, and conclusion.
- Make it student-friendly.
- No plagiarism.
- Do not mention AI.

Also generate:
1. PowerPoint outline (10–12 slides).
2. Cover page text.
`.trim();

      output.value = prompt;

      // Google Analytics Event
      gtag('event', 'generate_prompt', {
        'event_category': 'Button',
        'event_label': 'Generate Prompt'
      });
    });

    openGeminiBtn.addEventListener('click', () => {
      window.open('https://gemini.google.com/app', '_blank');

      gtag('event', 'open_gemini', {
        'event_category': 'Button',
        'event_label': 'Open Gemini AI'
      });
    });

    downloadPdfBtn.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const text = output.value;

      if (!text.trim()) {
        alert('Please generate a prompt first!');
        return;
      }

      const lines = doc.splitTextToSize(text, 180);
      doc.text(lines, 10, 10);
      doc.save('school_project_prompt.pdf');

      gtag('event', 'download_pdf', {
        'event_category': 'Button',
        'event_label': 'Download PDF'
      });
    });
  </script>
</body>
</html>
